
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>YEEUN - UI</title>
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YeeunUI" />

    <link rel="icon" type="image/png" href="assets/icons/favicon-1.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
  
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --point-color: #28CC9E; /* Vivid Teal */
        --secondary-color: #196B69; /* Dark Teal */
        --accent-cyan: #FF6B6B; /* Complementary Soft Coral */
        --light-mint: #DDFEE4; /* Light Mint */
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        overflow: hidden;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,'Helvetica Neue', Arial, system-ui, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        cursor: none !important;
      }
      
      a, button, input, textarea, select, [role="button"], * {
        cursor: none !important;
      }
      
      .perspective-container {
        perspective: 2500px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }

      /* cursor */
      .video-hover * {
        cursor: auto !important;
      }
      
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--point-color);
        border-radius: 0;
      }

      /* Darker Scrollbar for Detail Modal */
      .custom-scrollbar-dark::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar-dark::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .custom-scrollbar-dark::-webkit-scrollbar-thumb {
        background: var(--light-mint);
        border-radius: 0;
      }

      /* 3D Cube Flip */
      .cube-btn {
        perspective: 500px;
        height: 20px;
        overflow: visible;
      }
      .cube-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .cube-btn:hover .cube-inner {
        transform: rotateX(-90deg);
      }
      .cube-face {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
      }
      .cube-face-front {
        transform: rotateX(0deg) translateZ(10px);
      }
      .cube-face-bottom {
        transform: rotateX(90deg) translateZ(10px);
        color: var(--point-color);
      }

      /* Transitions */
      .fade-enter { opacity: 0; }
      .fade-enter-active { opacity: 1; transition: opacity 500ms ease-in; }

      /* no-scrollbar */
      /* .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      } */
    </style>
